# Standalone OddWorks: LAN HTTP endpoint on port 80.
server {
    listen 0.0.0.0:80 default_server;
    server_name _;
    root /opt/oddworks/current;
    index index.php;
    client_max_body_size 30m;
    location ^~ /gestion-projet/ {
        rewrite ^/gestion-projet/(.*)$ /$1 last;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(config|includes|install|scripts|tests|deploy|vendor|packaging)/ { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(sqlite|db|env|log|sh|py|json|md|yml|yaml|txt|ini|lock|sql|bak)$ { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/oddworks.sock;
    }
}
