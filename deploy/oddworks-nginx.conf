# Dedicated local OddWorks endpoint; external publishing is out of scope.
server {
    listen 127.0.0.1:18081;
    server_name localhost;
    root /opt/oddworks/current;
    index index.php;
    client_max_body_size 30m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(?:config|includes|install|scripts|tests|deploy|vendor|\\.git)/ { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/oddworks.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:sqlite|db|env|log|sh|py|json|md|yml|yaml)$ { deny all; }
}
