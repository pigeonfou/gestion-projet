name: Déployer gestion-projet

on:
  push:
    branches: [main, NewUxUi, recode]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche Git à déployer"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: gestion-projet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Vérifications avant déploiement
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          git check-ref-format --branch "$DEPLOY_BRANCH"
          cd /var/www/html/gestion-projet
          git fetch origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          candidate=$(git rev-parse "refs/remotes/origin/$DEPLOY_BRANCH")
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$candidate" != "$GITHUB_SHA" ]]; then
            echo "La branche a changé depuis cette exécution."
            exit 1
          fi
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          git archive "$candidate" | tar -x -C "$test_dir"
          php "$test_dir/scripts/test.php"
          python3 "$test_dir/tests/recode_http.py"
          echo "PHP et tests : OK"
      - name: Déployer
        shell: bash
        run: |
          sudo -n /usr/local/sbin/gestion-projet-deploy deploy "$DEPLOY_BRANCH"
          test "$(git -C /var/www/html/gestion-projet rev-parse HEAD)" = "${{ steps.preflight.outputs.candidate }}"
      - name: État final
        if: always()
        shell: bash
        run: |
          cd /var/www/html/gestion-projet
          git branch --show-current
          git log -1 --oneline
          git status --short

