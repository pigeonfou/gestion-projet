name: Déployer OddWorks sur .28
on:
  push:
    branches: [main, deployment-oddworks-28, experimentation/etudes-fiches]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Installer le commit de main après les contrôles
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oddworks-28-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer PHP pour les contrôles isolés
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: Syntaxe et régressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/oddworks-deploy
          bash -n scripts/install-oddworks-deploy.sh
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -name '*.php' -print0)
          for file in tests/*.php; do
            case "$file" in
              tests/nextcloud_sans_curl.php|tests/document_upload_stream.php) php -n "$file" ;;
              *) php "$file" ;;
            esac
          done
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/experimentation/etudes-fiches'
        with:
          node-version: '22'
      - name: Préparer la recette navigateur expérimentale
        if: github.ref == 'refs/heads/experimentation/etudes-fiches'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Valider les fiches avant tout déploiement
        if: github.ref == 'refs/heads/experimentation/etudes-fiches'
        env:
          PROJECTFLOW_DB_PATH: /tmp/oddworks-etudes-browser.sqlite
          PROJECTFLOW_BASE_PATH: ''
          PROJECTFLOW_ADMIN_PASSWORD: etudes-browser-only
        run: |
          set -euo pipefail
          node --check assets/js/etudes-fiches.js
          php install/init_database.php
          php tests/fixtures/etudes.php
          php -S 127.0.0.1:8091 >/tmp/etudes-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/etudes-server.log' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/login.php >/dev/null && break; sleep 1; done
          node tests/etudes_fiches_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/experimentation/etudes-fiches'
        with:
          name: etudes-fiches-apercus
          path: /tmp/etudes-*.png
  runner:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64, oddworks-28]
    timeout-minutes: 5
    steps:
      - name: Vérifier la machine et l’installation existante
        shell: bash
        run: |
          set -euo pipefail
          ip -4 -o addr show | grep -Eq 'inet 192[.]168[.]6[.]28/'
          systemctl is-active oneforall-oddworks-web.service
          systemctl is-active oneforall-nginx.service
          readlink -f /opt/oneforall/apps/oddworks/current
          curl --fail --silent --show-error --max-time 20 \
            -H 'Host: www.pigeonfou.com' \
            http://127.0.0.1:18080/oddworks/login.php | grep -F '<title>Connexion - OddWorks</title>' >/dev/null
          echo 'Runner oddworks-28 et page de connexion locale : OK'
  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimentation/etudes-fiches') && (github.event_name == 'push' || inputs.deploy == true)
    needs: [validate, runner]
    runs-on: [self-hosted, Linux, X64, oddworks-28]
    timeout-minutes: 15
    steps:
      - name: Déployer le commit exact avec sauvegarde SQLite
        env:
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          helper_name=oddworks-deploy
          if [[ "$TARGET_BRANCH" == experimentation/etudes-fiches ]]; then
            helper_name=oddworks-deploy-etudes
          fi
          helper=$(mktemp)
          trap 'rm -f "$helper"' EXIT
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/pigeonfou/gestion-projet/${TARGET_SHA}/scripts/${helper_name}" -o "$helper"
          if ! cmp -s "$helper" "/usr/local/sbin/$helper_name"; then
            echo "::error::Le script administrateur $helper_name doit être installé ou actualisé sur le serveur avant le déploiement. Le code actif reste inchangé."
            exit 1
          fi
          sudo -n "/usr/local/sbin/$helper_name" "$TARGET_SHA"
      - name: Vérifier la page publique via Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --retry 3 --retry-delay 2 \
            https://www.pigeonfou.com/oddworks/login.php | grep -F '<title>Connexion - OddWorks</title>' >/dev/null
          echo 'Page publique de connexion : OK. Les parcours authentifiés restent à vérifier dans le navigateur.'
