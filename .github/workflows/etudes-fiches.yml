name: Expérimentation études en fiches
on:
  push:
    branches: [experimentation/etudes-fiches]
  pull_request:
    paths:
      - 'assets/**/etudes-fiches.*'
      - 'tests/etudes_fiches_browser.cjs'
      - '.github/workflows/etudes-fiches.yml'
permissions:
  contents: read
jobs:
  recette:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Outils isolés de recette
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntaxe et régressions PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find . -name '*.php' -not -path './node_modules/*' -print0)
          node --check assets/js/etudes-fiches.js
          node --check assets/js/projet-r1b.js
          for file in tests/*.php; do
            case "$file" in
              tests/nextcloud_sans_curl.php|tests/document_upload_stream.php) php -n "$file" ;;
              *) php "$file" ;;
            esac
          done
      - name: Recette navigateur sur base jetable
        env:
          PROJECTFLOW_DB_PATH: /tmp/oddworks-etudes-browser.sqlite
          PROJECTFLOW_BASE_PATH: ''
          PROJECTFLOW_ADMIN_PASSWORD: etudes-browser-only
        run: |
          set -euo pipefail
          php install/init_database.php
          php tests/fixtures/etudes.php
          php -S 127.0.0.1:8091 >/tmp/etudes-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/etudes-server.log' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/login.php >/dev/null && break; sleep 1; done
          node tests/etudes_fiches_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etudes-fiches-apercus
          path: /tmp/etudes-*.png
