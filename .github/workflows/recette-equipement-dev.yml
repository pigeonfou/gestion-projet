name: Recette équipement intégré DEV
on:
  push:
    branches: [experimentation/etudes-fiches]
    paths:
      - '.github/workflows/recette-equipement-dev.yml'
      - 'tests/recette-equipement/**'
permissions:
  contents: read
concurrency:
  group: oddworks-28-deploy
  cancel-in-progress: false
jobs:
  acces:
    runs-on: [self-hosted, Linux, X64, oddworks-28]
    timeout-minutes: 3
    steps:
      - name: Vérifier les accès de recette sans modifier les données
        shell: bash
        run: |
          set -euo pipefail
          ip -4 -o addr show | grep -Eq 'inet 192[.]168[.]6[.]28/'
          id
          sudo -n -l
          for path in /var/lib/oneforall/oddworks/database.sqlite /opt/oneforall/apps/oddworks/current; do
            test ! -r "$path" || echo "Lecture possible : $path"
          done
          test ! -w /var/lib/oneforall/oddworks/database.sqlite || echo 'Écriture base possible par le runner'
          sudo -n -u ofa-oddworks /usr/bin/id || true
