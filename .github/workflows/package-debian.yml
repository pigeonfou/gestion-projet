name: OddWorks - construire paquet Debian
on:
  push:
    branches: [extraction-oddworks-autonome]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: oddworks-debian-production
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier la procédure PROD
        run: bash packaging/debian/check-production-source.sh
      - name: Vérifier le déploiement DEV de référence
        uses: actions/github-script@v7
        with:
          script: |
            await require('./packaging/debian/check-dev-run.cjs')({github, context, core});
      - name: Comparer le code applicatif à DEV
        run: python3 packaging/debian/check-dev-parity.py
      - name: Vérifier le calcul de version
        run: node packaging/debian/test-version.cjs
      - name: Réserver une nouvelle version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            await require('./packaging/debian/reserve-version.cjs').reserve({github, context, core});
      - name: Syntaxe et construction
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/debian/build.sh packaging/debian/install-ubuntu.sh packaging/debian/oddworks-configure packaging/debian/oddworks-web-setup packaging/debian/installer-support
          bash packaging/debian/build.sh "$ODDWORKS_PACKAGE_VERSION"
          echo "Working directory: $PWD"
          ls -lah dist/
          test -f "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb"
          dpkg-deb --info "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb"
          dpkg-deb --ctrl-tarfile "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" | tar -xOf - ./postinst | sh -n
          dpkg-deb --field "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" Depends | grep -F python3-venv
          dpkg-deb --contents "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" | grep -F /usr/sbin/oddworks-web-setup
          dpkg-deb --contents "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" | grep -F /usr/share/oddworks/index.php
      - name: Installation et verification fonctionnelle locale
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Exercise a real 1.0.3 -> new version upgrade on this disposable CI machine.
          curl -fL --retry 3 https://github.com/pigeonfou/gestion-projet/releases/download/oddworks-deb-v1.0.3/oddworks_1.0.3_all.deb -o /tmp/oddworks_1.0.3_all.deb
          echo '10dad8d6c2d7c8e047fe47babb8d4c24f687d6e37760f7b6a717281d628c1478  /tmp/oddworks_1.0.3_all.deb' | sha256sum -c -
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/oddworks_1.0.3_all.deb
          sudo sqlite3 /var/lib/oddworks/database.sqlite "INSERT INTO parametres(cle,valeur) VALUES('upgrade_keep_test','preserved');"
          sudo sh -c 'echo "# upgrade-preserved" >> /etc/nginx/sites-available/oddworks.conf'
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "./dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb"
          sudo test -f /var/lib/oddworks-installer/completed
          backup=$(sudo cat /var/lib/oddworks-installer/backup)
          sudo test -s "$backup/database.sqlite"
          sudo test -s "$backup/existing.tar.gz"
          sudo sqlite3 "$backup/database.sqlite" "SELECT valeur FROM parametres WHERE cle='upgrade_keep_test';" | grep -Fx preserved
          # A fresh reinstall must never be selected silently over existing data.
          if sudo env DEBIAN_FRONTEND=noninteractive ODDWORKS_INSTALL_MODE=fresh /usr/lib/oddworks/installer-support upgrade; then exit 1; fi
          # Exercise the real interactive cancellation without touching the installation.
          if printf '3\n' | sudo env DEBIAN_FRONTEND=readline script -qec '/usr/lib/oddworks/installer-support upgrade' /dev/null; then exit 1; fi
          sudo grep -F '# upgrade-preserved' /etc/nginx/sites-available/oddworks.conf
          sudo sqlite3 /var/lib/oddworks/database.sqlite "SELECT valeur FROM parametres WHERE cle='upgrade_keep_test';" | grep -Fx preserved
          sudo test -f /usr/share/oddworks/inventaire.php
          php tests/inventory_catalogue.php
          sudo test -s /var/lib/oddworks/database.sqlite
          sudo test -s /var/lib/oddworks/initial-admin-password
          sudo nginx -t
          curl -fsS -o /dev/null http://127.0.0.1/assets/css/style.css
          curl -fsS -o /dev/null http://127.0.0.1/gestion-projet/assets/css/style.css
          curl -fsS -o /dev/null http://127.0.0.1/assets/js/app.js
          php -v
          curl -fsS -o /tmp/oddworks-login.html -w '%{http_code}\n' http://127.0.0.1/login.php | grep -Fx 200
          sudo sqlite3 /var/lib/oddworks/database.sqlite "SELECT identifiant FROM utilisateurs WHERE role='admin';" | grep -Fx admin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le module installé dans le navigateur
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          export INVENTORY_TEST_ROOT=http://127.0.0.1
          export INVENTORY_TEST_PASSWORD="$(sudo cat /var/lib/oddworks/initial-admin-password)"
          node tests/inventory_browser.cjs
      - name: Tester la réinstallation neuve et les identifiants initiaux
        shell: bash
        run: |
          set -euo pipefail
          old_hash=$(sudo sha256sum /var/lib/oddworks/initial-admin-password | cut -d ' ' -f 1)
          sudo env DEBIAN_FRONTEND=noninteractive ODDWORKS_INSTALL_MODE=fresh ODDWORKS_CONFIRM_FRESH=YES dpkg -i "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" > /tmp/oddworks-fresh.log 2>&1
          sudo test -s /var/lib/oddworks/initial-admin-password
          new_hash=$(sudo sha256sum /var/lib/oddworks/initial-admin-password | cut -d ' ' -f 1)
          test "$old_hash" != "$new_hash"
          backup=$(sudo cat /var/lib/oddworks-installer/backup)
          sudo test -s "$backup/previous-data/database.sqlite"
          sudo sqlite3 /var/lib/oddworks/database.sqlite 'SELECT COUNT(*) FROM stock_articles;' | grep -Fx 0
          grep -F 'Compte initial : admin' /tmp/oddworks-fresh.log
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          secret=Path('/var/lib/oddworks/initial-admin-password').read_text().strip()
          assert secret not in Path('/tmp/oddworks-fresh.log').read_text()
          print('Mot de passe absent des journaux non interactifs : OK')
          PYTHON
          # Capture the controlling-terminal output privately, never in Actions logs.
          sudo env DEBIAN_FRONTEND=readline script -qec '/usr/lib/oddworks/installer-support finish' /var/lib/oddworks-installer/tty-display-test.log > /dev/null
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          secret=Path('/var/lib/oddworks/initial-admin-password').read_text().strip()
          log=Path('/var/lib/oddworks-installer/tty-display-test.log').read_text()
          assert 'Identifiant : admin' in log and secret in log
          print('Affichage sur le terminal initial : OK')
          PYTHON
      - name: Enregistrer la provenance et les empreintes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          baseline = json.loads(pathlib.Path("packaging/debian/dev-baseline.json").read_text())
          payload = {"dev_baseline": baseline, "repository": os.environ["GITHUB_REPOSITORY"], "branch": os.environ["GITHUB_REF_NAME"], "commit": os.environ["GITHUB_SHA"], "tag": os.environ["ODDWORKS_PACKAGE_TAG"], "workflow": os.environ["GITHUB_WORKFLOW"], "runner": "ubuntu-24.04", "run_url": os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"], "validation": "CI uniquement ; recette majiflow à effectuer", "packages": [{"file": p.name, "version": subprocess.check_output(["dpkg-deb", "--field", str(p), "Version"], text=True).strip()} for p in sorted(pathlib.Path("dist").glob("*.deb"))]}
          pathlib.Path("dist/PROVENANCE.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2)+"\n")
          PYTHON
          source_line=$(dpkg-deb --fsys-tarfile "dist/oddworks_${ODDWORKS_PACKAGE_VERSION}_all.deb" | tar -xOf - ./usr/share/doc/oddworks/source-commit)
          test "$source_line" = "Source-Commit: $GITHUB_SHA"
          (cd dist && sha256sum -- *.deb PROVENANCE.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: oddworks-deb-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/PROVENANCE.json
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publier le téléchargement direct du Debian
        uses: actions/github-script@v7
        with:
          script: |
            await require('./packaging/debian/publish-release.cjs')({github, context, core});
